<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Pick a place</title>

<!--
  The safe-zone map picker, hosted at file:///android_asset/map/map.html.

  Three rules govern this file, and all three exist because it is loaded inside
  a WebView on a phone that may have no working data connection:

  1. NO BLANK PAGE. If Leaflet does not arrive, this page renders a plain,
     readable message on the app's own ground colour. A white void with a
     silent script error is the worst possible outcome here, because the user
     cannot tell whether the app is broken or the network is.

  2. THE THEME COMES FROM A QUERY PARAMETER, not from prefers-color-scheme.
     Honouring the system colour scheme inside a WebView needs
     isAlgorithmicDarkeningAllowed (API 33+) or the deprecated forceDark
     (API 29-32), and the app's minSdk is 26. Reading ?dark=1 works on every
     supported release with no version fork.

  3. THE PAGE TALKS BACK BY NAVIGATION, not by a JavaScript bridge. Picking a
     point sets location.href to safeshade://pick?lat=..&lon=.., which the
     Kotlin side intercepts in shouldOverrideUrlLoading. That avoids
     addJavascriptInterface entirely - one less injected object reachable from
     any script this page happens to load.

  Accepted query parameters: lat, lon, radius (metres), dark (1 or 0).
  Kotlin -> page:  window.safeshadeSetPoint(lat, lon, radiusMeters)
  Page -> Kotlin:  safeshade://pick?lat=<lat>&lon=<lon>
-->

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin="" />
<style>
  :root {
    --ground: #F2EFE9;
    --plate: #FBF9F5;
    --ink: #22282E;
    --ink-muted: #5A6068;
    --hairline: #D3CDC0;
    --brass: #B9A88A;
  }
  html[data-theme="dark"] {
    --ground: #14171A;
    --plate: #1C2126;
    --ink: #ECEFF1;
    --ink-muted: #A0A8B0;
    --hairline: #353C43;
    --brass: #8A7A5E;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  #map { position: absolute; inset: 0; background: var(--ground); }

  /* The fallback panel. Shown only when Leaflet is genuinely unavailable. */
  #fallback {
    display: none;
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 24px;
    background: var(--ground);
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #fallback.shown { display: flex; }
  #fallback .inner {
    max-width: 30em;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--plate);
    padding: 20px;
  }
  #fallback h1 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  #fallback .rule { height: 2px; background: var(--brass); margin: 0 0 12px; }
  #fallback p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-muted); }

  /* Leaflet's own chrome, brought into the board's vocabulary: flat surfaces,
     machined corners, a hairline instead of a drop shadow. */
  .leaflet-container { background: var(--ground); font-family: inherit; }
  .leaflet-bar a,
  .leaflet-control-attribution {
    background: var(--plate);
    color: var(--ink);
    border-color: var(--hairline);
  }
  .leaflet-bar a { border-radius: 4px; }
  .leaflet-bar { box-shadow: none; border: 1px solid var(--hairline); border-radius: 4px; }
  .leaflet-control-attribution { font-size: 10px; }
  .leaflet-control-attribution a { color: var(--ink-muted); }
  html[data-theme="dark"] .leaflet-tile { filter: brightness(0.72) contrast(1.08); }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="fallback" role="status">
    <div class="inner">
      <h1>Map unavailable</h1>
      <div class="rule"></div>
      <p>The map needs a data connection the first time it is opened. Type the
         latitude and longitude below, or use the current location button, and
         the safe zone will work exactly the same.</p>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        crossorigin=""
        onerror="window.safeshadeLeafletFailed = true;"></script>
<script>
(function () {
  "use strict";

  function param(name, fallback) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : fallback;
  }

  var lat = parseFloat(param("lat", "22.5726"));
  var lon = parseFloat(param("lon", "88.3639"));
  var radius = parseFloat(param("radius", "200"));
  var dark = param("dark", "0") === "1";

  if (!isFinite(lat)) { lat = 22.5726; }
  if (!isFinite(lon)) { lon = 88.3639; }
  if (!isFinite(radius) || radius <= 0) { radius = 200; }

  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");

  // Leaflet may be missing for two different reasons - the script 404'd, or it
  // never left the request queue because there is no network - and neither
  // fires a JS error we could catch. Testing for the global covers both.
  if (typeof L === "undefined" || window.safeshadeLeafletFailed) {
    document.getElementById("fallback").classList.add("shown");
    // The picker's coordinate fields live in the Compose layer below this
    // WebView and are always on screen, so there is nothing more to do here:
    // the screen is still fully usable.
    return;
  }

  var map = L.map("map", {
    center: [lat, lon],
    zoom: 16,
    zoomControl: true,
    attributionControl: true
  });

  var tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap"
  });
  tiles.addTo(map);

  // Tiles failing is a softer failure than Leaflet failing: pan, zoom and the
  // marker all still work over a blank ground, and the chosen coordinates are
  // still correct. So this only annotates; it does not take over the screen.
  var tileErrors = 0;
  tiles.on("tileerror", function () {
    tileErrors += 1;
    if (tileErrors === 6) {
      map.attributionControl.setPrefix("Map images unavailable offline");
    }
  });

  var marker = L.marker([lat, lon], { draggable: true }).addTo(map);
  var ring = L.circle([lat, lon], {
    radius: radius,
    color: dark ? "#8A7A5E" : "#B9A88A",
    weight: 2,
    fillColor: dark ? "#ECEFF1" : "#22282E",
    fillOpacity: 0.08
  }).addTo(map);

  // Debounced so dragging a marker does not fire one navigation per frame.
  var pending = null;
  function report(latlng) {
    if (pending) { clearTimeout(pending); }
    pending = setTimeout(function () {
      window.location.href =
        "safeshade://pick?lat=" + latlng.lat.toFixed(6) + "&lon=" + latlng.lng.toFixed(6);
    }, 120);
  }

  function place(latlng, announce) {
    marker.setLatLng(latlng);
    ring.setLatLng(latlng);
    if (announce) { report(latlng); }
  }

  map.on("click", function (e) { place(e.latlng, true); });
  marker.on("drag", function (e) { ring.setLatLng(e.target.getLatLng()); });
  marker.on("dragend", function (e) { place(e.target.getLatLng(), true); });

  /**
   * Called from Kotlin whenever the coordinate fields or the current-location
   * button change the point. `announce` is deliberately false: the Compose
   * layer already knows this value, and echoing it back would loop.
   */
  window.safeshadeSetPoint = function (nextLat, nextLon, nextRadius) {
    if (!isFinite(nextLat) || !isFinite(nextLon)) { return; }
    var latlng = L.latLng(nextLat, nextLon);
    if (isFinite(nextRadius) && nextRadius > 0) { ring.setRadius(nextRadius); }
    place(latlng, false);
    if (!map.getBounds().contains(latlng)) { map.panTo(latlng); }
  };

  window.safeshadeRecenter = function () { map.panTo(marker.getLatLng()); };
})();
</script>
</body>
</html>
