<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  color-scheme tells Gmail, Apple Mail and Outlook.com not to invert this
  message themselves. They do it badly: a dark-mode inversion of a white panel
  with charcoal ink turns the amber and teal accents into colours that no longer
  measure against their backgrounds, and the one thing an alert email cannot
  afford is an unreadable heading.
-->
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>{{title}}</title>
<!--
  Archivo is the product's typeface (DESIGN.md). Apple Mail, iOS Mail, Outlook
  for Mac and Samsung Mail load it from Google Fonts; Gmail and Outlook for
  Windows do not load web fonts at all and show the fallback stack, which is
  the system face on every platform: San Francisco, Segoe UI, Roboto. The
  metrics are close enough that nothing reflows.
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap');
  /*
    Almost nothing lives here. Gmail strips <style> in some clients and
    Outlook's Word rendering engine ignores most of it, so every rule that
    matters is inlined on the element. This block carries only the things that
    can be lost without breaking the message.
  */
  body { margin: 0; padding: 0; background: #EDF4F3; }
  a { color: #22282E; }
  /* Outlook.com and Apple Mail can still force a dark rendering even with
     color-scheme set. These rules make that case survivable rather than
     pretty: the panel keeps a light ground and the ink keeps its contrast, so
     no heading is ever charcoal on charcoal. */
  @media (prefers-color-scheme: dark) {
    .ss-panel { background: #FFFFFF !important; }
    .ss-ink { color: #22282E !important; }
  }
  @media (max-width: 620px) {
    .ss-pad { padding-left: 20px !important; padding-right: 20px !important; }
    .ss-h1 { font-size: 24px !important; line-height: 30px !important; }
    .ss-code { font-size: 32px !important; letter-spacing: 6px !important; }
    .ss-stat { font-size: 24px !important; }
  }
</style>
</head>
<!--
  Bulletproof table layout, 600px, everything inlined, everything centred.

  600px because it is the width Outlook's reading pane has been for fifteen
  years, and a message wider than that gets a horizontal scrollbar in the client
  most likely to belong to somebody's employer.

  Nested tables rather than divs because Outlook renders HTML through Word, which
  has no float, no flexbox, no grid and unreliable margins. Tables are the only
  layout primitive that behaves the same in Word, Gmail's stripped CSS and
  Apple Mail's WebKit. Centring is done with align="center" on cells and tables
  for the same reason: Word ignores margin:auto.

  Brand palette, from DESIGN.md and the logo:
    charcoal  #22282E   ink, the code box, the alert button
    mist      #EDF4F3   the page ground, a teal-tinted white
    bone      #F2EFE9   quiet blocks inside the panel
    white     #FFFFFF   the panel
    teal      #6FD3CC   confirmation; the routine button
    amber     #F5A623   attention; the second colour of the band
    trip red  #E5484D   emergency, and nothing routine

  The look, in one paragraph. A white card on a teal-tinted page. The masthead
  is the full logo alone, centred - emblem, wordmark and tagline already
  combined in that one hosted image - then a band in the message's own colour
  with an amber tail (the logo's amber dot, carried across). The body is
  centred text with a charcoal code box or a teal button as its one big
  object. There is no logo above the footer; the footer says why the mail
  came, that replies are not read, the address, and the copyright line.
-->
<body style="margin:0; padding:0; background:#EDF4F3;">

<!-- Preheader: the grey line the inbox shows after the subject. Hidden in the
     message body itself. Without one, clients scrape the first visible text,
     which here would be the word "SafeShade" - a wasted line on an email whose
     whole job may be to say somebody has fallen. -->
<div style="display:none; font-size:1px; color:#EDF4F3; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
  {{preheader}}
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#EDF4F3;">
  <tr>
    <td align="center" style="padding:28px 12px 36px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center" style="width:600px; max-width:600px;">

        <!-- Masthead: one image, the full logo on its beige ground with the
             card's top corners already rounded (brand.ts MASTHEAD_URL).

             Why an image and not a coloured cell: Gmail on Android recolours
             any background it judges light, in spite of color-scheme meta,
             bgcolor attributes and inline styles, all of which were tried on
             2026-09-10 and all of which it ignored. The logo's charcoal
             wordmark then vanished into a darkened cell. Pixels inside an
             image are the one thing no client repaints, so the whole
             masthead is a 600x168 image. The alt text carries the brand for
             the client that blocks remote images until asked. -->
        <tr>
          <td align="center" bgcolor="#F2EDE3" style="background:#F2EDE3; padding:0; font-size:0; line-height:0; border-radius:18px 18px 0 0; text-align:center;">
            <img src="{{masthead}}" width="600" height="168" alt="SafeShade - Your Everything Safety Companion"
                 style="display:block; margin:0 auto; border:0; outline:none; text-decoration:none; width:600px; height:168px; max-width:100%;">
          </td>
        </tr>

        <!-- The band. Coloured by the message's purpose: teal for
             confirmation, amber for attention, red for an emergency. The
             amber tail is the logo's dot; on an amber band it simply reads
             as a longer band, and on the red one it is the only colour that
             is not red. Pixel widths, because Word ignores percentages. -->
        <tr>
          <td style="padding:0; font-size:0; line-height:0;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;">
              <tr>
                <td width="480" style="width:480px; background:{{accent}}; height:6px; line-height:6px; font-size:0;">&nbsp;</td>
                <td width="120" style="width:120px; background:#F5A623; height:6px; line-height:6px; font-size:0;">&nbsp;</td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Body. Centred; a body that needs a left-aligned block (a medical
             summary, a list of who was reached) says so on that block. -->
        <tr>
          <td class="ss-pad ss-panel" align="center" style="background:#FFFFFF; padding:34px 32px 30px; text-align:center; font-family:Archivo, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color:#22282E;">
            {{{content}}}
          </td>
        </tr>

        <!--
          Footer. In this order, because each line answers a question somebody
          asks of an unexpected email:

            1. why did I get this            {{{footer}}}, written by the sender
            2. can I reply                   no, and it says so rather than
                                             leaving a reply to disappear
            3. where is this from            the address, as the owner gave it
                                             on 2026-09-10; a top border is what
                                             now separates the footer from the
                                             panel, since there is no logo above
                                             it to do that job
            4. whose is it                   the copyright line
        -->
        <tr>
          <td class="ss-pad" align="center" style="background:#F6F4EF; border-top:1px solid #E4E0D8; border-radius:0 0 18px 18px; padding:18px 32px 22px; text-align:center; font-family:Archivo, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:12px; line-height:17px; color:#6A7078;">
            <div style="margin:0; padding:0; line-height:17px;">{{{footer}}}</div>
            <div style="margin:0; padding:0; line-height:17px;">Replies to this address are not read.</div>
            <div style="margin:6px 0 0; padding:0; line-height:17px; color:#8A9099;">SafeShade, Patia, OD, India | CQ5D-OTPM</div>
            <div style="margin:0; padding:0; line-height:17px; color:#8A9099;">&copy; 2026 SafeShade. All rights reserved.</div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
