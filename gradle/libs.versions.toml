[versions]
agp = "9.1.1"
kotlin = "2.2.10"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycle = "2.10.0"
activityCompose = "1.12.2"
composeBom = "2026.06.01"
navigationCompose = "2.9.8"
coreSplashscreen = "1.2.0"
datastore = "1.1.1"
gson = "2.10.1"
retrofit = "2.9.0"
playServicesLocation = "21.1.0"
zxing = "3.5.4"
osmdroid = "6.1.20"
coroutines = "1.9.0"
# --- Phase 2 ---
credentials = "1.5.0"
googleid = "1.1.1"
billing = "7.1.1"

# --- Cloud (Phase 1) ---
# supabase-kt is published as a BOM; every module below is versionless and takes
# its version from it, which is the only way to keep auth/postgrest/storage/
# realtime/functions on one internally-consistent set.
#
# NOTE ON KOTLIN METADATA - this pin is not free to move.
#
# 3.8.0 was tried first and does not build here. Its modules are compiled by
# Kotlin 2.4.0 (it drags in kotlin-reflect 2.4.0), and a 2.2.10 compiler reads
# at most N+1 metadata, so every one of the six modules fails with
# "Module was compiled with an incompatible version of Kotlin". It is a hard
# stop, not a warning: `:app:compileDebugKotlin` failed on the classpath scan
# before a single line of cloud code existed.
#
# 3.2.6 was the instructed fallback and it compiles. Nothing between 3.2.6 and
# 3.8.0 was tried, so this is not known to be the newest version that works -
# only that it works.
#
# Do NOT "fix" this by raising `kotlin`: the Compose compiler plugin takes its
# version from that same ref, and Compose BOM 2026.06.01 is itself pinned to
# what compiles against compileSdk 36 (see docs/handoff6.md section 4.4).
# And do NOT reach for `-Xskip-metadata-version-check`; it suppresses the error
# and then fails at runtime on whichever inline function actually differs.
supabase = "3.2.6"
# Ktor is supabase-kt's HTTP layer. It must match the Ktor major/minor the BOM
# was built against or the engine fails to resolve at runtime, not at compile.
ktor = "3.4.3"
# Pinned explicitly rather than left to Ktor's own transitive choice, because
# the app already ships OkHttp through Retrofit and two OkHttp majors on one
# classpath is a `NoSuchMethodError` at first request.
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }

androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
osmdroid-android = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }

# --- Cloud (Phase 1) ---
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-auth = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-storage = { group = "io.github.jan-tennert.supabase", name = "storage-kt" }
supabase-realtime = { group = "io.github.jan-tennert.supabase", name = "realtime-kt" }
supabase-functions = { group = "io.github.jan-tennert.supabase", name = "functions-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Phase 2: Google sign-in through Credential Manager (the Web client ID is
# the audience; see docs/wizards/google-signin.md) and Play Billing for the
# cloud tiers. play-services-auth is the Credential Manager backend for
# Android 13 and below, which the test phone is.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
billing-ktx = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "billing" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Bundled with the Kotlin distribution, so it takes `kotlin`'s version ref and
# can never drift from the compiler that runs it.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
